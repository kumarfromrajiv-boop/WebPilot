
services:
  - type: web
    name: ai-browser-automation
    runtime: python

    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: OPENROUTER_API_KEY
        sync: false

      - key: OPENROUTER_MODEL
        sync: false

      - key: ADMIN_SECRET
        generateValue: true

      - key: ALLOWED_HOSTS
        sync: false

      - key: MAX_STEPS
        value: "12"

      - key: TASK_TIMEOUT
        value: "180"
